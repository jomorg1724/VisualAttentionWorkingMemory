   <text style="fill: #192b3b; font: 700 20px 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start" x="52.668" y="38.088975" transform="rotate(-0 52.668 38.088975)">Memory probes / perturbing the stored state</text>
  </g>
  <g id="text_31">
   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 542.887687)">128 trials per delay. Reset affects all KDA scales, not the GRU. β=0 removes writes and delta correction; α=1 removes diagonal decay, not all</text>
   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 555.183937)">possible forgetting. Blank clamps are absent at D0. No paired outcomes or uncertainty were saved. Reset shows dependence under perturbation, not</text>
   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 567.309562)">exclusive memory localization.</text>
  </g>
