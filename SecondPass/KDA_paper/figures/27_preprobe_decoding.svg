  <g id="text_30">
   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 542.887687)">Last pre-probe frame is the second sample at D0 and the last blank at other delays. Each cell is a separately fitted, same-time held-out decoder</text>
   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 555.183937)">of cos(2θ), sin(2θ); it is not a cross-time generalization test or an angular-error estimate.</text>
