   <text style="fill: #526577; font: 10px 'Arial', 'DejaVu Sans', sans-serif" transform="translate(52.668 542.887687)">Schematic of the implemented KDA arm. Each accumulator output is concatenated with its convolutional feature map before the next block (or final</text>
